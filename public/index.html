<!DOCTYPE html>
<html>

<head>
    <title>PersonaForge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <div class="navbar">
        <div>
            <h1>PersonaForge</h1>
        </div>
        <div>
            <button id="login-btn"><i class="fa-solid fa-arrow-right-to-bracket login-btn"></i></button>
        </div>
    </div>
    <div id="messages">
        <!-- messages will go here using JS... hopefully. -->
    </div>
    <div class="hidden" id="loader-container">
        <div class="ai chatbox loader-box">
            <div class="loader first"></div>
            <div class="loader second"></div>
            <div class="loader third"></div>
        </div>
    </div>




    <div class="input-container">
        <input id="chat" placeholder="Type something..."><button id="send-btn"><i
                class="fa-solid fa-paper-plane"></i></button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://kit.fontawesome.com/f38573ff90.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>

</body>

</html>
